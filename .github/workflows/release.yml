# Every push to main (i.e. every merge) publishes a new GitHub Release with the
# installable ZIP. Version: header version if newer than the latest tag,
# otherwise bumped from Conventional Commits (see bin/release.sh).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # The version-bump commit made by this workflow must not trigger another release.
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PHP syntax check
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0 \
            | xargs -0 -n1 php -l > /dev/null

      - name: Compute version, update files and changelog
        id: ver
        run: bin/release.sh

      - name: Commit version bump and changelog
        if: steps.ver.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${{ steps.ver.outputs.version }}"
          git push origin HEAD:main

      - name: Build ZIP
        run: bin/build.sh HEAD

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "Release v${VERSION} already exists; nothing to do."
            exit 0
          fi
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" dist/*.zip dist/*.sha256 \
            --title "v${VERSION}" \
            --notes-file "${{ steps.ver.outputs.notes }}" \
            --verify-tag
